services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rav
      POSTGRES_PASSWORD: rav
      POSTGRES_DB: rav
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rav"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAV_DATABASE_URL: postgresql://rav:rav@postgres:5432/rav
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    profiles: ["app"]
volumes:
  pgdata:
